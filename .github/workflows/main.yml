name: Main

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check-workflows:
    name: Check workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download actionlint
        id: download-actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-bash.sh) 1.7.7
        shell: bash
      - name: Check workflow files
        run: ${{ steps.download-actionlint.outputs.executable }} -color -matcher .github/actionlint-matcher.json
        shell: bash

  build-lint-test:
    name: Build, lint, and test
    needs: check-workflows
    uses: ./.github/workflows/build-lint-test.yml

  all-jobs-pass:
    name: All jobs pass
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - build-lint-test
    steps:
      - run: |
          passed="${{ needs.build-lint-test.result }}"
          if [[ $passed != "success" ]]; then
            exit 1
          fi

  is-release:
    name: Determine whether this is a release merge commit
    needs: build-lint-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.is-release.outputs.is-release }}
    steps:
      - id: is-release
        uses: MetaMask/action-is-release@v2

  publish-release:
    name: Publish release
    needs: is-release
    if: needs.is-release.outputs.is-release == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-release.yml
    secrets: inherit
