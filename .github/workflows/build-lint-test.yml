name: Build, Lint, and Test

on:
  workflow_call:

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      child-workspace-package-names: ${{ steps.workspace-package-names.outputs.child-workspace-package-names }}
    steps:
      - uses: MetaMask/action-checkout-and-setup@v3
      - name: Get workspace package names
        id: workspace-package-names
        run: |
          echo "child-workspace-package-names=$(yarn workspaces list --json | jq --slurp --raw-output '[.[].name] | @json')" >> "$GITHUB_OUTPUT"
        shell: bash

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: MetaMask/action-checkout-and-setup@v3
      - run: yarn build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: MetaMask/action-checkout-and-setup@v3
      - run: yarn lint
      - name: Validate RC changelog
        if: ${{ startsWith(github.head_ref, 'release/') }}
        run: yarn lint:changelog --rc
      - name: Validate changelog
        if: ${{ !startsWith(github.head_ref, 'release/') }}
        run: yarn lint:changelog

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: MetaMask/action-checkout-and-setup@v3
        with:
          node-version: ${{ matrix.node-version }}
      - run: yarn test

  compatibility-test:
    name: Compatibility test
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: MetaMask/action-checkout-and-setup@v3
      - name: Remove yarn.lock
        run: rm yarn.lock
      - name: Install without lockfile
        run: YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install
      - name: Run tests
        run: yarn test
      - name: Restore lockfile
        run: git checkout yarn.lock
